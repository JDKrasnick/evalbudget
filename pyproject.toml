[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalbudget"
version = "0.2.0"
description = "Adaptive, statistically rigorous evaluation for paired model outputs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "evalbudget contributors" }]

[project.scripts]
evalbudget = "evalbudget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
